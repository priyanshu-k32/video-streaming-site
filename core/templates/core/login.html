<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Ocean</title>
    <style>
        :root { color-scheme: light; --ink: #102a43; --muted: #627d98; --line: #d9e2ec; --accent: #ef8354; --paper: #f7f9fb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: radial-gradient(circle at 15% 10%, #d9f0f0 0, transparent 34%), var(--paper); font-family: Georgia, 'Times New Roman', serif; }
        main { width: min(100%, 440px); padding: 48px; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(16, 42, 67, .12); }
        .mark { color: var(--accent); font: 700 13px/1.2 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
        h1 { margin: 14px 0 8px; font-size: clamp(34px, 8vw, 48px); line-height: 1; font-weight: 400; }
        .intro { margin: 0 0 30px; color: var(--muted); font: 15px/1.6 Arial, sans-serif; }
        label { display: block; margin: 18px 0 7px; font: 700 12px/1.2 Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        input { width: 100%; padding: 14px 0; border: 0; border-bottom: 1px solid var(--line); color: var(--ink); font: 16px Arial, sans-serif; outline: none; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; margin-top: 30px; padding: 15px; border: 0; color: #fff; background: var(--ink); cursor: pointer; font: 700 13px Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
        button:hover { background: var(--accent); }
        .error { padding: 12px; color: #9b2c2c; background: #fff5f5; font: 13px/1.5 Arial, sans-serif; }
    </style>
</head>
<body>
    <main>
        <div class="mark">Ocean workspace</div>
        <h1>Welcome back.</h1>
        <p class="intro">Sign in to continue to your dashboard.</p>
        {% if form.errors %}<div class="error">Your username or password was incorrect. Please try again.</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            {{ form.username }}
            <label for="id_password">Password</label>
            {{ form.password }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Sign in</button>
        </form>
        <p class="intro" style="margin: 24px 0 0; text-align: center;">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </main>
</body>
</html>
