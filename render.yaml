services:
  - type: web
    name: ocean-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "ocean-dashboard.onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://ocean-dashboard.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: ocean-db
          property: connectionString
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: ocean-db
    databaseName: ocean
    user: ocean